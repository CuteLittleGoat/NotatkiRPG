<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Notatki drużyny i interaktywne mapy kampanii RPG.">
<title>NotatkiRPG — Data-Slate</title>
<link rel="icon" href="aplikacja/grafika/ikona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap">
<link rel="stylesheet" href="aplikacja/css/slate.css">
<script type="module" src="aplikacja/js/start.js"></script>
</head>
<body class="motyw-zielony strona-startowa">
<div class="slate">
  <header class="slate-gora">
    <h1 class="slate-tytul">+++ DATA-SLATE // NOTATKI RPG +++</h1>
    <span class="ozdoba tylko-szeroki">ARCHIWUM DRUŻYNY · DOSTĘP ZASTRZEŻONY</span>
    <div class="konto" id="konto" hidden></div>
  </header>
  <main class="slate-srodek slate-przewijany" id="srodek">
    <div class="tresc-widoku">
      <section class="panel-ramka" id="sekcja-kampanii" aria-labelledby="naglowek-kampanii" hidden>
        <h2 class="sekcja-tytul" id="naglowek-kampanii">WYBIERZ KAMPANIĘ</h2>
        <p class="przygaszony" id="opis-listy" hidden></p>
        <ul class="lista-kampanii" id="kampanie"></ul>
      </section>
      <section class="panel-ramka" id="sekcja-logowania" aria-labelledby="naglowek-logowania">
        <h2 class="sekcja-tytul" id="naglowek-logowania">LOGOWANIE</h2>
        <div id="logowanie-tresc"><p class="przygaszony">Łączenie…</p></div>
      </section>
    </div>
  </main>
  <footer class="slate-dol">
    <span>Notatki drużyny zapisują się na żywo — wszyscy widzą je od razu.</span>
    <span id="status-konto" hidden></span>
    <span class="ozdoba ozdoba-dluga">+++ 01001110 01001111 01010100 01000001 01010100 01001011 01001001 +++</span>
  </footer>
  <div class="skan" aria-hidden="true"></div>
</div>
<noscript><p class="formularz-blad">Ta strona wymaga włączonego JavaScriptu.</p></noscript>
</body>
</html>
