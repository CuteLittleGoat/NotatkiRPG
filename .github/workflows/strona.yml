# Publikacja strony na GitHub Pages.
# Uruchamia się po każdej zmianie na gałęzi main (i ręcznie: zakładka Actions → „Run workflow”).
# Na stronę trafiają WYŁĄCZNIE pliki wybrane przez narzedzia/zbuduj_strone.py —
# rysunki od MG, narzędzia i testy zostają tylko w repozytorium.
# Jednorazowe ustawienie: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Publikacja strony (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publikacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Node.js (do testów jednostkowych)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testy (format kopii, skrypty map i publikacji)
        run: |
          node testy/jednostkowe.mjs
          python3 -m unittest discover -s testy -p "test_*.py" -v

      - name: Złożenie strony (tylko dozwolone pliki, bez rysunków MG)
        run: python3 narzedzia/zbuduj_strone.py _site

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotowanie paczki strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publikacja
        id: wdrozenie
        uses: actions/deploy-pages@v4
