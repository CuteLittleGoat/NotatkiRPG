<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Data-Slate — kampania</title>
<link rel="icon" href="aplikacja/grafika/ikona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap">
<link rel="stylesheet" href="aplikacja/css/slate.css">
<script type="module" src="aplikacja/js/uruchom-kampanie.js"></script>
</head>
<body class="motyw-zielony strona-kampanii">
<div class="slate">
  <header class="slate-gora">
    <a class="slate-powrot" href="index.html" title="Wybór kampanii" aria-label="Wróć do wyboru kampanii">◂</a>
    <h1 class="slate-tytul" id="tytul">+++ DATA-SLATE +++</h1>
    <div class="konto" id="konto"></div>
  </header>
  <nav class="zakladki" id="zakladki" role="tablist" aria-label="Zakładki"></nav>
  <main class="slate-srodek" id="srodek">
    <p class="baner-bledu" id="baner" role="alert" hidden></p>

    <section class="widok widok-map" id="widok-map" role="tabpanel" hidden>
      <nav class="indeks" id="indeks" aria-label="Indeks miejsc" hidden></nav>
      <div class="obszar-map" id="obszar-map">
        <div class="pasek-mapy" role="toolbar" aria-label="Sterowanie mapą">
          <button class="przycisk przycisk-mapy" id="przycisk-indeks" type="button" aria-controls="indeks" aria-expanded="false">INDEKS</button>
          <button class="przycisk przycisk-mapy" id="przycisk-przybliz" type="button" aria-label="Przybliż">+</button>
          <button class="przycisk przycisk-mapy" id="przycisk-oddal" type="button" aria-label="Oddal">−</button>
          <button class="przycisk przycisk-mapy" id="przycisk-calosc" type="button" aria-label="Widok początkowy">⌂</button>
        </div>
        <div class="pasek-ukrycia" id="pasek-ukrycia" role="status" hidden>
          <span>⊘ Ta zakładka jest ukryta przed graczami.</span>
          <button class="przycisk przycisk-maly" id="przycisk-odslon" type="button">ODSŁOŃ GRACZOM</button>
        </div>
        <p class="brak-map" id="brak-map" hidden>+++ BRAK UDOSTĘPNIONYCH MAP +++<br>Mistrz Gry nie odsłonił jeszcze żadnej mapy.</p>
        <div class="skan" aria-hidden="true"></div>
      </div>
      <aside class="panel-elementu" id="panel" aria-label="Karta miejsca" hidden></aside>
    </section>

    <section class="widok widok-lista" id="widok-notatki" role="tabpanel" hidden></section>
    <section class="widok widok-lista" id="widok-admin" role="tabpanel" hidden></section>
    <p class="widok-pusto" id="widok-pusto" hidden>+++ BRAK UDOSTĘPNIONYCH ZAKŁADEK +++<br>Mistrz Gry nie udostępnił jeszcze żadnej zakładki.</p>
  </main>
  <footer class="slate-dol" id="status"></footer>
</div>
<noscript><p class="formularz-blad">Ta strona wymaga włączonego JavaScriptu.</p></noscript>
</body>
</html>
